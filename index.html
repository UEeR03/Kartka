<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>It's for you💗</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #EEC9D2, #F6B8B8);
    font-family: 'Libre Baskerville', serif;
  }

  .card-container {
    perspective: 1500px;
  }

  .card {
    width: 650px;
    height: 430px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(0.4, 0.2, 0.2, 1), box-shadow 0.3s;
    cursor: pointer;
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.25);
    touch-action: manipulation; 
  }

  .card.flipped {
    transform: rotateY(180deg) scale(1.03) translateZ(15px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    backface-visibility: hidden;
    overflow: hidden;
    border: 2px solid rgba(200,180,150,0.5);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }

  .card-face.front img,
  .card-face.back img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 20px;
    background: repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.05),
      rgba(255,255,255,0.05) 2px,
      transparent 2px,
      transparent 4px
    );
    transition: background 0.5s ease-in-out;
  }

  .card-face.front img:hover,
  .card-face.back img:hover {
    background: repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.08),
      rgba(255,255,255,0.08) 2px,
      transparent 2px,
      transparent 4px
    );
  }

  .card-face.back {
    transform: rotateY(180deg);
  }

  
  .click-text {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    color: #111111;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: opacity 0.5s;
  }

  footer {
    margin-top: 20px;
    color: #555;
    font-size: 16px;
  }
   
  
  @media (max-width: 768px) {
    .card {
      width: 90vw;
      height: calc(90vw * 0.66);
    }
    .click-text {
      font-size: 36px; 
      bottom: 20px;
    }
  }
</style>
</head>
<body>

<div class="card-container">
  <div class="card" id="card">
    <div class="card-face front">
      <img src="strona1.png" alt="Front kartki" />
      <div class="click-text" id="clickText"><em>Kliknij</em></div>
    </div>
    <div class="card-face back">
      <img src="strona2.png" alt="Tył kartki" />
    </div>
  </div>
</div>

<footer>Autor: <em>Mateusz</em></footer>
<footer><em>18.09.2026</em></footer>
<script>
  const card = document.getElementById('card');
  const clickText = document.getElementById('clickText');

  card.addEventListener('click', () => {
    card.classList.toggle('flipped');
    clickText.style.opacity = card.classList.contains('flipped') ? '0' : '1';
  });
</script>

</body>
</html>
